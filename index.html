<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container py-5">
        <div class="header p-4 mb-4">
            <p class="mb-1">STUDENT PORTAL</p>
            <h1>Student Management</h1>
            <p class="mb-0">Manage your student records in one place.</p>
        </div>

        <div class="row g-4">
            <!-- Student Form -->
            <div class="col-12 col-md-5">
                <div class="box p-4 h-100">
                    <h4 id="formTitle">Add a Student</h4>
                    <p class="text-secondary">Enter student details below.</p>

                    <label class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-control mb-3" placeholder="Enter name" />

                    <label class="form-label">Age</label>
                    <input type="number" id="age" class="form-control mb-3" placeholder="Enter age" />

                    <label class="form-label">Course</label>
                    <input type="text" id="course" class="form-control mb-1" placeholder="Enter course" />

                    <p id="message" class="text-danger small mt-2 mb-3"></p>

                    <button id="submitBtn" class="btn btn-primary w-100" onclick="addStudent()">
                        + Add Student
                    </button>
                    <button id="cancelBtn" class="btn btn-secondary w-100 mt-2" onclick="cancelEdit()" hidden>
                        Cancel Edit
                    </button>
                </div>
            </div>

            <!-- Student Records -->
            <div class="col-12 col-md-7">
                <div class="box p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h4>Student Records</h4>
                            <p class="text-secondary mb-0">All registered students</p>
                        </div>

                        <div class="count-box text-center">
                            <h3 id="totalStudents" class="mb-0">0</h3>
                            <small>Students</small>
                        </div>
                    </div>

                    <div id="studentList"></div>
                </div>
            </div>
        </div>

        <p class="text-center text-secondary small mt-4">
            Student Management System
        </p>
    </div>

    <script src="script.js"></script>
</body>

</html>
